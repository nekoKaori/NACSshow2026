<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable =no">
    <title>NACS Show 2026 Presentation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- iPad presentation Container (Locked Landscape 1180x820) -->
    <main class="presentationFrame">
    
    <!-- Header (Brand) -->
    <header class="splashHeader">
        <div class="logo">
            <img src="images/logoETG.svg" alt="Excel Tire GaugeLogo" class="brandLogo">
        </div>
        <div class="tagline">
            <p>America's Leader in Digital Air Calibration</p>
        </div>
    </header>

    <!-- Button Section -->
    <div class="stageWrapper">
        <section class="hubStage">
            <nav class="cardGrid">
                
                <!-- Gas Station -->
                <a href="pages/gasHub.html" class="hubBtn">
                <div class="iconBox">
                    <img src="images/iconGas.svg" alt="Gas Station Icon"> 
                </div>
                <h2>GAS STATION<br>C-STORE</h2>
                </a>

                <!-- Car Wash -->
                <a href="pages/carWashHub.html" class="hubBtn">
                <div class="iconBox">
                    <img src="images/iconCarwash.svg" alt="Car Wash Icon">
                </div>
                <h2>CAR<br>WASH</h2>
                </a>

                <!-- Custom Decals -->
                <a href="pages/customDecalHub.html" class="hubBtn">
                <div class="iconBox">
                    <img src="images/iconCustom.svg" alt="Custom Decals Icon">
                </div>
                <h2>CUSTOM<br>DECALS</h2>
                </a>
            </nav>
        </section>
    </div>

    <!-- Footer -->
    <footer class="splashFooter">
        <p>Touch Screen to Explore</p>
    </footer>

</main>
<script src="js/main.js"></script>
</body>
</html>
