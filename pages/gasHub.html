<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable =no">
    <title>NACS Show 2026 Presentation</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- iPad presentation Container (Locked Landscape 1180x820) -->
    <main class="presentationFrame">
    
    <!-- Header (Brand) -->
    <header class="splashHeader">
        <div class="logo">
            <img src="../images/logoETG.svg" alt="Excel Tire GaugeLogo" class="brandLogo">
        </div>
        <div class="tagline">
            <p>America's Leader in Digital Air Calibration</p>
        </div>
    </header>

    <!-- Button Section -->
    <div class="stageWrapper">
        <section class="hubStage">
            <nav class="cardGrid">
                
                <!-- Equipment  -->
                <a href="gasEquipmentHub.html" class="hubBtn">
                <div class="iconBox">
                    <img src="../images/iconEquipment.svg" alt="SC09 Air Vac
                     Icon"> 
                </div>
                <h2>EQUIPMENT</h2>
                </a>

                <!-- Revenue Share -->
                <a href="revShare.html" class="hubBtn">
                <div class="iconBox">
                    <img src="../images/iconHandshake.svg" alt="Hand Shake Icon">
                </div>
                <h2>REVENUE SHARE</h2>
                </a>

                <!-- Testimonials -->
                <a href="testimonialsGas.html" class="hubBtn">
                <div class="iconBox">
                    <img src="../images/iconTestimonial.svg" alt="Testimonials
                     Icon">
                </div>
                <h2>TESTIMONIALS</h2>
                </a>
            </nav>
        </section>
    </div>

    <!-- Footer -->
    <footer class="navFooter">
        <div class="navGroup">

            <!-- Home Button -->
            <a href="../index.html" class="navBtn">
                <img src="../images/iconHome.svg" alt="Home Icon" class="navIcon">
                <span>HOME</span>
            </a>
        </div>

    </footer>

</main>
<script src="../js/main.js"></script>
</body>
</html>
