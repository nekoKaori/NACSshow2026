<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1180, height=820, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AirExcel - Revenue Share Program</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/revenueShare.css">
</head>
<body class="appBody">

    <div class="presentationFrame">
        <!-- Top Header -->
        <header class="aeHeader">
            <div class="aeHeaderLeft">
                <img src="../images/logoAE.svg" alt="AirExcel" class="aeBrandLogo">
            </div>
            <div class="aeHeaderRight">
                <div class="aeTitleGroup">
                    <span class="aeTitleLine">REVENUE SHARE</span>
                    <span class="aeTitleLine">PROGRAM</span>
                </div>
            </div>
        </header>

        <!-- Sub-Navigation Strip -->
        <nav class="revNavStrip">
            <button type="button" class="tabBtn active" data-img="../images/revShare1.png">INTRODUCTION</button>
            <button type="button" class="tabBtn" data-img="../images/revShare2.png">WHY JOIN</button>
            <button type="button" class="tabBtn" data-img="../images/revShare3.png">DATA DRIVEN</button>
            <button type="button" class="tabBtn" data-img="../images/revShare4.png">SERVICE MAP</button>
            <button type="button" class="tabBtn" data-img="../images/revShare5.png">POWERED BY EXCEL</button>
        </nav>

        <!-- Presentation Stage -->
        <main class="revStage">
            <img id="revStageImg" src="../images/revShare1.png" alt="Revenue Share Program">
        </main>

        <!-- Standard Bottom Footer -->
        <footer class="navFooter">
            <button type="button" class="navBtn" onclick="history.back()">
                <img src="../images/iconBack.svg" alt="Back" class="navIcon">
                <span>Back</span>
            </button>

            <a href="../index.html" class="navBtn">
                <img src="../images/iconHome.svg" alt="Home" class="navIcon">
                <span>Home</span>
            </a>
        </footer>
    </div>

    <script src="../js/revenueShare.js"></script>
</body>
</html>
