<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel Tire Gauge">
    <title>Custom Decals</title>
    <!-- Base styles first, custom decal hub layout second -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/customDecalHub.css">
</head>

<body>
    <!-- iPad Presentation Container (Locked Landscape 1180x820) -->
    <main class="presentationFrame">

        <!-- Top Header -->
        <header class="equipHeader">
            <div class="equipLogo">
                <img src="../images/logoETG.svg" alt="Excel Tire Gauge Logo" class="brandLogoSmall">
            </div>
            <div class="equipTitle">
                <h1>Custom Decals</h1>
                <p>Tap to View Decal Examples</p>
            </div>
        </header>

        <!-- 3 Machine Cards Stage -->
        <div class="stageWrapper decalStageWrapper">
            <div class="cardStage threeColStage">
                
                <!-- Machine 1: SC09-SS -->
                <a href="customSC09SS.html" class="machineCard">
                    <div class="machineImgWrap">
                        <img src="../images/ybhSC09.png" alt="SC09-SS Custom Decal">
                    </div>
                    <div class="machineMeta">
                        <span class="machineBadge">SC09-SS</span>
                        <span class="machineSub">Coin & Cashless</span>
                    </div>
                </a>

                <!-- Machine 2: SC05-SS -->
                <a href="customSC05SS.html" class="machineCard">
                    <div class="machineImgWrap">
                        <img src="../images/ybhSC05.png" alt="SC05-SS Custom Decal">
                    </div>
                    <div class="machineMeta">
                        <span class="machineBadge">SC05-SS</span>
                        <span class="machineSub">Cashless</span>
                    </div>
                </a>

                <!-- Machine 3: SCWM-23 -->
                <a href="customSCWM23.html" class="machineCard">
                    <div class="machineImgWrap">
                        <img src="../images/ybhSCWM23.png" alt="SCWM-23 Custom Decal">
                    </div>
                    <div class="machineMeta">
                        <span class="machineBadge">SCWM-23</span>
                        <span class="machineSub">Wall Mount</span>
                    </div>
                </a>

            </div>
        </div>

        <!-- Navigation Footer -->
        <footer class="navFooter">
            <a href="../index.html" class="navBtn">
                <img src="../images/iconHome.svg" alt="Home Icon" class="navIcon">
                <span>Home</span>
            </a>
        </footer>

    </main>
</body>
</html>
